<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmoothPlay</title>
<style>
:root{--bg:#f3f4f8;--surface:#fff;--ink:#1c2030;--mute:#667;--line:#dde0ea;--daily:#2f9c8f;--game:#d98a1c;--accent:var(--daily);--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171a26;--surface:#212536;--ink:#e8eaf2;--mute:#9aa0b8;--line:#33384d;--daily:#4fb8aa;--game:#f0b04a;--on:#10131c}}
body.game{--accent:var(--game)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:0 14px calc(28px + env(safe-area-inset-bottom,0px))}
header{padding:calc(22px + env(safe-area-inset-top,0px)) 4px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:26px;letter-spacing:-.4px}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 4px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.seg button{border:0;border-radius:10px;padding:16px 8px;background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:left}
.seg button small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.seg button.on{background:var(--accent);color:var(--on)}
.seg button.on small{color:var(--on);opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr}
.grid div{padding:11px 14px;border-bottom:1px solid var(--line)}
.grid div:nth-child(odd){border-right:1px solid var(--line)}
.grid div:nth-last-child(-n+2){border-bottom:0}
.grid b{display:block;font-size:16px}
.grid span{color:var(--mute);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--mute);font-size:12px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px}
input[type=search]{width:100%;margin:10px 0 0}
.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{transform:translateX(18px)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button,.danger{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 10px;font:inherit;font-weight:600}
.tools button small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.danger{width:100%;margin-top:8px;color:#d1453b}
#list{max-height:300px;overflow:auto}
#list label{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);word-break:break-all;font-size:13px}
#list input{width:18px;height:18px;accent-color:var(--accent);flex:none}
pre{margin:0;padding:12px 14px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--mute);max-height:200px;overflow:auto}
#toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>SmoothPlay</h1><p id="meta"></p></div>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="id">Indonesia</option></select>
</header>

<div class="card seg" id="seg">
  <button data-p="daily" type="button"><span data-i="daily"></span><small data-i="daily_s"></small></button>
  <button data-p="game" type="button"><span data-i="game"></span><small data-i="game_s"></small></button>
</div>

<h2 data-i="status"></h2>
<div class="card grid" id="stat"></div>

<h2 data-i="automation"></h2>
<div class="card">
  <label class="row"><span><span data-i="auto"></span><small data-i="auto_s"></small></span><input class="sw" type="checkbox" id="auto"></label>
  <label class="row"><span><span data-i="dnd"></span><small data-i="dnd_s"></small></span><input class="sw" type="checkbox" id="dnd"></label>
</div>

<h2 data-i="refresh"></h2>
<div class="card">
  <label class="row"><span><span data-i="daily"></span><small data-i="rd_s"></small></span><select id="rd"></select></label>
  <label class="row"><span><span data-i="game"></span><small data-i="rg_s"></small></span><select id="rg"></select></label>
</div>

<h2 data-i="gamelist"></h2>
<div class="card" style="padding:0 14px 0"><input type="search" id="q" data-ph="search"></div>
<div class="card" id="list" style="margin-top:8px"></div>

<h2 data-i="tools"></h2>
<div class="tools">
  <button type="button" id="clean"><span data-i="clean"></span><small data-i="clean_s"></small></button>
  <button type="button" id="trim"><span data-i="trim"></span><small data-i="trim_s"></small></button>
  <button type="button" id="dex"><span data-i="dex"></span><small data-i="dex_s"></small></button>
  <button type="button" id="logbtn"><span data-i="logbtn"></span><small data-i="logbtn_s"></small></button>
</div>
<button class="danger" type="button" id="restore" data-i="restore"></button>

<h2 data-i="log"></h2>
<div class="card"><pre id="log"></pre></div>
<div id="toast" role="status"></div>

<script>
const BIN='/data/adb/modules/smoothplay/bin/smoothplay';
const I={
en:{daily:'Daily',daily_s:'Smooth & efficient',game:'Game',game_s:'Full performance',status:'Status',automation:'Automation',
auto:'Auto-switch profile',auto_s:'Game profile starts when a listed app is opened',dnd:'Do Not Disturb in games',dnd_s:'DND is restored when you leave the game',
refresh:'Refresh rate',rd_s:'Maximum; minimum 60 Hz',rg_s:'Locked to this value',gamelist:'Game list',search:'Search installed apps',
tools:'Tools',clean:'Clean RAM',clean_s:'Stop cached processes',trim:'Clear caches',trim_s:'Cache of all apps',dex:'Optimize apps',dex_s:'Compile with speed-profile',
logbtn:'Load log',logbtn_s:'Last 40 lines',restore:'Restore defaults',log:'Log',lognotloaded:'Not loaded yet.',
loading:'loading…',by:'by',daemon_run:'running',daemon_stop:'stopped',k_active:'Active profile',none:'None yet',k_gov:'CPU governor',k_ram:'Free RAM',k_swap:'Swappiness',k_temp:'Battery temp',k_batt:'Battery',
sysdef:'System default',nomatch:'No matching apps.',added:'Added to game list',removed:'Removed from game list',
confirm:'Restore all settings to their values from before the module was used?',logempty:'Log is empty.',failed:'Failed',
notksu:'Open this page from KernelSU, APatch or KsuWebUI.',noresp:'Module is not responding',
t_daily:'Daily profile active (auto-switch off)',t_game:'Game profile active (auto-switch off)',t_saved:'Saved',t_ram:'Available RAM: {a} MB → {b} MB',
t_trim:'App caches cleared',t_dex:'Optimization started in the background (a few minutes)',t_restore:'Settings restored. Auto-switch turned off.'},
id:{daily:'Daily',daily_s:'Halus & hemat',game:'Game',game_s:'Performa penuh',status:'Status',automation:'Otomatis',
auto:'Ganti profil otomatis',auto_s:'Profil Game aktif saat aplikasi di daftar dibuka',dnd:'Jangan ganggu saat game',dnd_s:'DND dipulihkan setelah keluar dari game',
refresh:'Refresh rate',rd_s:'Maksimum; minimum 60 Hz',rg_s:'Dikunci ke nilai ini',gamelist:'Daftar game',search:'Cari aplikasi terpasang',
tools:'Alat',clean:'Bersihkan RAM',clean_s:'Hentikan proses cache',trim:'Bersihkan cache',trim_s:'Cache semua aplikasi',dex:'Optimasi aplikasi',dex_s:'Kompilasi speed-profile',
logbtn:'Muat log',logbtn_s:'40 baris terakhir',restore:'Pulihkan bawaan',log:'Log',lognotloaded:'Belum dimuat.',
loading:'memuat…',by:'oleh',daemon_run:'berjalan',daemon_stop:'mati',k_active:'Profil aktif',none:'Belum ada',k_gov:'Governor CPU',k_ram:'RAM bebas',k_swap:'Swappiness',k_temp:'Suhu baterai',k_batt:'Baterai',
sysdef:'Bawaan sistem',nomatch:'Tidak ada aplikasi yang cocok.',added:'Ditambahkan ke daftar game',removed:'Dihapus dari daftar game',
confirm:'Pulihkan semua pengaturan ke nilai sebelum modul dipakai?',logempty:'Log kosong.',failed:'Gagal',
notksu:'Buka halaman ini lewat KernelSU, APatch, atau KsuWebUI.',noresp:'Modul tidak merespons',
t_daily:'Profil Daily aktif (auto-switch mati)',t_game:'Profil Game aktif (auto-switch mati)',t_saved:'Tersimpan',t_ram:'RAM tersedia: {a} MB → {b} MB',
t_trim:'Cache aplikasi dibersihkan',t_dex:'Optimasi berjalan di latar belakang (beberapa menit)',t_restore:'Pengaturan dipulihkan. Auto-switch dimatikan.'}
};
const $=s=>document.querySelector(s);
const q1=a=>"'"+String(a).replace(/'/g,"'\\''")+"'";
let lang='en',S=null,games=new Set(),installed=[];
try{const v=localStorage.getItem('sp_lang');lang=v&&I[v]?v:(navigator.language||'en').toLowerCase().startsWith('id')?'id':'en'}catch(e){lang=(navigator.language||'en').toLowerCase().startsWith('id')?'id':'en'}
const t=k=>I[lang][k]??I.en[k]??k;

function applyLang(){
  document.documentElement.lang=lang;$('#lang').value=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph);e.setAttribute('aria-label',t(e.dataset.ph))});
  if(!$('#log').dataset.has)$('#log').textContent=t('lognotloaded');
  render();renderList();
}

function exec(cmd){
  return new Promise(res=>{
    if(typeof ksu==='undefined'){res({code:1,out:'',err:t('notksu')});return}
    const cb='_cb'+Date.now()+Math.random().toString(36).slice(2);
    window[cb]=(c,o,e)=>{delete window[cb];res({code:c,out:(o||'').trim(),err:(e||'').trim()})};
    ksu.exec(cmd,'{}',cb);
  });
}
const sp=(...a)=>exec([BIN,...a.map(q1)].join(' '));
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
async function act(ok,...a){
  const r=await sp(...a);
  toast(r.code===0?(typeof ok==='function'?ok(r.out):t(ok)):(r.err||r.out||t('failed')));
  await load();return r;
}

function opts(sel,val){
  sel.innerHTML='';
  [['',t('sysdef')],['60','60 Hz'],['90','90 Hz'],['120','120 Hz'],['144','144 Hz']].forEach(([v,x])=>sel.add(new Option(x,v)));
  sel.value=val||'';
}

async function load(){
  const r=await sp('status');
  if(r.code!==0){S=null;$('#meta').textContent=r.err||t('noresp');return}
  S=Object.fromEntries(r.out.split('\n').map(l=>{const i=l.indexOf('=');return[l.slice(0,i),l.slice(i+1)]}));
  render();
}
function render(){
  if(!S){if(!$('#meta').textContent)$('#meta').textContent=t('loading');return}
  const s=S;
  document.body.classList.toggle('game',s.active==='game');
  $('#meta').textContent=`${s.version} ${t('by')} @arqzey · daemon ${s.daemon==='1'?t('daemon_run'):t('daemon_stop')}`;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===s.active));
  $('#auto').checked=s.auto==='1';$('#dnd').checked=s.dnd==='1';
  opts($('#rd'),s.refresh_daily);opts($('#rg'),s.refresh_game);
  const cells=[[t('k_active'),s.active==='none'?t('none'):t(s.active)],[t('k_gov'),s.governor||'-'],
    [t('k_ram'),`${s.ram_free} / ${s.ram_total} MB`],[t('k_swap'),s.swappiness||'-'],
    [t('k_temp'),s.temp?s.temp+' °C':'-'],[t('k_batt'),s.battery?s.battery+'%':'-']];
  $('#stat').innerHTML=cells.map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('');
}

async function loadGames(){
  const [g,i]=await Promise.all([sp('games'),sp('installed')]);
  games=new Set(g.out.split('\n').filter(Boolean));
  installed=i.out.split('\n').filter(Boolean);
  renderList();
}
function renderList(){
  const f=$('#q').value.trim().toLowerCase();
  const all=[...new Set([...games,...installed])].filter(p=>p.toLowerCase().includes(f));
  all.sort((a,b)=>(games.has(b)-games.has(a))||a.localeCompare(b));
  const box=$('#list');box.innerHTML='';
  if(!all.length){const l=document.createElement('label');l.textContent=t('nomatch');box.append(l);return}
  all.forEach(p=>{
    const l=document.createElement('label'),c=document.createElement('input');
    c.type='checkbox';c.checked=games.has(p);
    c.onchange=async()=>{
      const r=await sp('games',c.checked?'add':'remove',p);
      if(r.code!==0){c.checked=!c.checked;toast(r.err||r.out);return}
      c.checked?games.add(p):games.delete(p);toast(t(c.checked?'added':'removed'));
    };
    l.append(c,document.createTextNode(p));box.append(l);
  });
}

document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>act('t_'+b.dataset.p,'profile',b.dataset.p));
$('#auto').onchange=e=>act('t_saved','set','AUTO_SWITCH',e.target.checked?1:0);
$('#dnd').onchange=e=>act('t_saved','set','GAME_DND',e.target.checked?1:0);
$('#rd').onchange=e=>act('t_saved','set','REFRESH_DAILY',e.target.value);
$('#rg').onchange=e=>act('t_saved','set','REFRESH_GAME',e.target.value);
$('#q').oninput=renderList;
$('#clean').onclick=()=>act(o=>{const m=o.match(/(\d+) MB -> (\d+) MB/);return m?t('t_ram').replace('{a}',m[1]).replace('{b}',m[2]):t('t_saved')},'clean');
$('#trim').onclick=()=>act('t_trim','trimcache');
$('#dex').onclick=()=>act('t_dex','dexopt');
$('#restore').onclick=()=>{if(confirm(t('confirm')))act('t_restore','restore')};
$('#logbtn').onclick=async()=>{const r=await sp('log');const p=$('#log');p.dataset.has='1';p.textContent=r.out||t('logempty')};
$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('sp_lang',lang)}catch(x){}applyLang()};

applyLang();load();loadGames();setInterval(load,10000);
</script>
</body>
</html>
