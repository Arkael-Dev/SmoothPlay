<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmoothPlay</title>
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{color-scheme:dark;--bg:#080a17;--surface:rgba(22,26,52,.82);--ink:#eef0ff;--mute:#9aa1c9;--line:rgba(130,140,255,.18);--daily:#22e3c5;--game:#ff7a2f;--accent:var(--daily);--accent2:#7a5cff;--on:#06101a;--bad:#ff5a6e}
body.game{--accent:var(--game);--accent2:#ff3d9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:0 14px calc(28px + env(safe-area-inset-bottom,0px));min-height:100vh;position:relative;overflow-x:hidden;
 background:radial-gradient(600px 400px at 90% -5%,color-mix(in srgb,var(--accent2) 28%,transparent),transparent 70%),radial-gradient(500px 380px at -10% 20%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
 background-image:linear-gradient(rgba(130,140,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(130,140,255,.07) 1px,transparent 1px);background-size:34px 34px;
 -webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%);animation:grid 12s linear infinite}
@keyframes grid{to{background-position:0 34px,34px 0}}
body>*{position:relative}
header{padding:calc(22px + env(safe-area-inset-top,0px)) 4px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:27px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;background:linear-gradient(90deg,#fff,var(--accent),var(--accent2),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
h2{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:24px 4px 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:16px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 8px var(--accent)}
.note{margin:6px 4px 0;color:var(--mute);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 4px 24px rgba(0,0,0,.35)}
.banner{border-radius:18px;padding:2px;margin-bottom:12px;background:conic-gradient(from var(--a),#22e3c5,#7a5cff,#ff3d9a,#ffb02e,#22e3c5);animation:spin 5s linear infinite;box-shadow:0 0 22px color-mix(in srgb,var(--accent2) 45%,transparent)}
@keyframes spin{to{--a:360deg}}
.banner .in{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(120deg,#0d1030,#1a1348);position:relative;overflow:hidden}
.banner .in::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-80px}100%{left:120%}}
.banner img{width:58px;height:58px;border-radius:15px;flex:none;animation:float 3s ease-in-out infinite,glow 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px var(--accent))}50%{filter:drop-shadow(0 0 12px var(--accent2))}}
.banner b{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:1px;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--accent)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.4s ease-in-out infinite}
.live.off{color:var(--bad)}.live.off::before{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:none}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips i{font-style:normal;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 45%,transparent);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.chips span{color:var(--mute);font-size:13px}
.warn{margin-bottom:12px;padding:11px 14px;border:1px solid var(--bad);border-radius:12px;background:rgba(255,90,110,.12);font-size:13px;animation:warnp 2s ease-in-out infinite}
@keyframes warnp{50%{box-shadow:0 0 14px rgba(255,90,110,.45)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.seg button{border:0;border-radius:10px;padding:16px 10px;background:transparent;color:var(--ink);font:inherit;font-weight:800;letter-spacing:.8px;text-transform:uppercase;text-align:left;transition:transform .15s,box-shadow .2s,background .2s}
.seg button:active{transform:scale(.97)}
.seg button small{display:block;font-weight:400;letter-spacing:0;text-transform:none;color:var(--mute);margin-top:2px}
.seg button.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.seg button.on small{color:#fff;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr}
.grid div{padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.grid div:nth-child(odd){border-right:1px solid var(--line)}
.grid div:nth-last-child(-n+2){border-bottom:0}
.grid b{display:block;font-size:16px;overflow-wrap:anywhere;color:var(--accent);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.grid span{color:var(--mute);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--mute);font-size:12px}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.row .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row .top b{font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 50%,transparent)}
select,input[type=search]{font:inherit;color:var(--ink);background:rgba(8,10,23,.7);border:1px solid var(--line);border-radius:9px;padding:8px;max-width:48%}
select:focus,input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent);outline:0}
input[type=search]{width:100%;max-width:none;margin:10px 0 0}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 60%,transparent))}
.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:rgba(130,140,255,.22);position:relative;flex:none;transition:background .2s,box-shadow .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}.sw:checked::after{transform:translateX(18px)}
.sw.bad:checked{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button,.danger{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 10px;font:inherit;font-weight:700;transition:transform .12s,border-color .2s,box-shadow .2s}
.tools button:active,.danger:active{transform:scale(.96)}
.tools button:hover,.tools button:focus-visible{border-color:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.tools button small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.danger{width:100%;margin-top:8px;color:var(--bad);border-color:rgba(255,90,110,.4)}
#list{max-height:300px;overflow:auto}
#list label{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);word-break:break-all;font-size:13px}
#list input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
#list .pn{flex:1;min-width:0}
#list select{flex:none;max-width:none;font-size:12px;padding:6px}
pre{margin:0;padding:12px 14px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--mute);max-height:200px;overflow:auto}
#toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:600;padding:12px 14px;border-radius:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
#toast.show{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>SmoothPlay</h1><p id="meta"></p></div>
  <select id="lang" aria-label="Language"><option value="en">English</option><option value="id">Indonesia</option></select>
</header>

<div class="banner"><div class="in">
  <img src="logo.png" alt="">
  <div><b>SmoothPlay <span class="live" id="live"></span></b><div class="chips" id="chips"></div></div>
</div></div>
<div class="warn" id="warn" role="alert" hidden data-i="warn_th"></div>

<div class="card seg" id="seg">
  <button data-p="daily" type="button"><span data-i="daily"></span><small data-i="daily_s"></small></button>
  <button data-p="game" type="button"><span data-i="game"></span><small data-i="game_s"></small></button>
</div>

<h2 data-i="status"></h2>
<div class="card grid" id="stat"></div>

<h2 data-i="automation"></h2>
<div class="card">
  <label class="row"><span><span data-i="auto"></span><small data-i="auto_s"></small></span><input class="sw" type="checkbox" id="auto"></label>
  <label class="row"><span><span data-i="dnd"></span><small data-i="dnd_s"></small></span><input class="sw" type="checkbox" id="dnd"></label>
  <label class="row"><span><span data-i="notify"></span><small data-i="notify_s"></small></span><input class="sw" type="checkbox" id="notify"></label>
</div>

<h2 data-i="refresh"></h2>
<div class="card">
  <label class="row"><span><span data-i="daily"></span><small data-i="rd_s"></small></span><select id="rd"></select></label>
  <label class="row"><span><span data-i="game"></span><small data-i="rg_s"></small></span><select id="rg"></select></label>
</div>

<h2 data-i="governors"></h2>
<div class="card">
  <label class="row"><span><span data-i="cpu_d"></span><small data-i="cpu_d_s"></small></span><select id="cd"></select></label>
  <label class="row"><span><span data-i="cpu_g"></span><small data-i="cpu_g_s"></small></span><select id="cg"></select></label>
  <label class="row"><span><span data-i="gpu_d"></span><small data-i="gpu_d_s"></small></span><select id="gd"></select></label>
  <label class="row"><span><span data-i="gpu_g"></span><small data-i="gpu_g_s"></small></span><select id="gg"></select></label>
</div>

<h2 data-i="thermal"></h2>
<div class="card">
  <label class="row"><span><span data-i="th_sw"></span><small data-i="th_sw_s"></small></span><select id="th"></select></label>
  <label class="row"><span><span data-i="th_guard"></span><small data-i="th_guard_s"></small></span><select id="thg"></select></label>
</div>

<h2 data-i="advanced"></h2>
<div class="card">
  <label class="row"><span><span data-i="swap_g"></span><small data-i="swap_s"></small></span><select id="swp"></select></label>
  <label class="row"><span><span data-i="vfs_g"></span><small data-i="vfs_s"></small></span><select id="vfs"></select></label>
  <label class="row"><span><span data-i="tcp_g"></span><small data-i="tcp_s"></small></span><select id="tcp"></select></label>
</div>

<h2 data-i="gamelist"></h2>
<p class="note" data-i="ds_note"></p>
<div class="card" style="padding:0 14px 0"><input type="search" id="q" data-ph="search"></div>
<div class="card" id="list" style="margin-top:8px"></div>

<h2 data-i="tools"></h2>
<div class="tools">
  <button type="button" id="clean"><span data-i="clean"></span><small data-i="clean_s"></small></button>
  <button type="button" id="trim"><span data-i="trim"></span><small data-i="trim_s"></small></button>
  <button type="button" id="dex"><span data-i="dex"></span><small data-i="dex_s"></small></button>
  <button type="button" id="fstrim"><span data-i="fstrim"></span><small data-i="fstrim_s"></small></button>
  <button type="button" id="tnotif"><span data-i="tnotif"></span><small data-i="tnotif_s"></small></button>
  <button type="button" id="logbtn"><span data-i="logbtn"></span><small data-i="logbtn_s"></small></button>
</div>
<button class="danger" type="button" id="restore" data-i="restore"></button>

<h2 data-i="log"></h2>
<div class="card"><pre id="log"></pre></div>
<div id="toast" role="status"></div>

const $=s=>document.querySelector(s);
const q1=a=>"'"+String(a).replace(/'/g,"'\\''")+"'";
let lang='en',S=null,games=new Set(),gres={},installed=[];
try{const v=localStorage.getItem('sp_lang');lang=v&&I[v]?v:(navigator.language||'en').toLowerCase().startsWith('id')?'id':'en'}catch(e){lang=(navigator.language||'en').toLowerCase().startsWith('id')?'id':'en'}
const t=k=>I[lang][k]??I.en[k]??k;

function applyLang(){
  document.documentElement.lang=lang;$('#lang').value=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph);e.setAttribute('aria-label',t(e.dataset.ph))});
  if(!$('#log').dataset.has)$('#log').textContent=t('lognotloaded');
  render();renderList();
}

function exec(cmd){
  return new Promise(res=>{
    if(typeof ksu==='undefined'){res({code:1,out:'',err:t('notksu')});return}
    const cb='_cb'+Date.now()+Math.random().toString(36).slice(2);
    window[cb]=(c,o,e)=>{delete window[cb];res({code:c,out:(o||'').trim(),err:(e||'').trim()})};
    ksu.exec(cmd,'{}',cb);
  });
}
const sp=(...a)=>exec([BIN,...a.map(q1)].join(' '));
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
async function act(ok,...a){
  const r=await sp(...a);
  toast(r.code===0?(typeof ok==='function'?ok(r.out):t(ok)):(r.err||r.out||t('failed')));
  await load();return r;
}

// Rebuilds a <select> only when its options change, and never while it is being used.
function fillSel(sel,items,val){
  const k=JSON.stringify(items);
  if(sel.dataset.k!==k){sel.innerHTML='';items.forEach(([v,x])=>sel.add(new Option(x,v)));sel.dataset.k=k}
  if(document.activeElement!==sel)sel.value=val??'';
}
function numItems(list,val,unit){
  const a=[...new Set([...list,...(val?[+val]:[])])].sort((x,y)=>x-y);
  return a.map(n=>[String(n),n+(unit||'')]);
}
function govItems(list,val,auto){
  const g=list.split(' ').filter(Boolean);
  if(val&&!g.includes(val))g.push(val);
  return [['',auto],...g.map(x=>[x,x])];
}

async function load(){
  const r=await sp('status');
  if(r.code!==0){S=null;$('#meta').textContent=r.err||t('noresp');return}
  S=Object.fromEntries(r.out.split('\n').map(l=>{const i=l.indexOf('=');return[l.slice(0,i),l.slice(i+1)]}));
  render();
  if(S.uilang&&S.uilang!==lang)sp('set','UILANG',lang);
}

function chips(s){
  const a=s.active,c=[];
  if(a==='game'||a==='daily')c.push(`${t(a)} ${t('profile_w')}`);
  const r=a==='game'?s.refresh_game:a==='daily'?s.refresh_daily:'';
  if(r)c.push(r+' Hz');
  const cg=a==='game'?s.cpu_gov_game:a==='daily'?s.cpu_gov_daily:'';
  const gg=a==='game'?s.gpu_gov_game:a==='daily'?s.gpu_gov_daily:'';
  if(cg)c.push('CPU '+cg);
  if(gg)c.push('GPU '+gg);
  if(a==='game'&&s.dnd==='1')c.push('DND');
  if(+s.ds_now<100)c.push(`${t('downscale')} ${s.ds_now}%`);
  if(s.thermal_off==='1')c.push(t('th_chip'));
  return c;
}

function render(){
  if(!S){if(!$('#meta').textContent)$('#meta').textContent=t('loading');return}
  const s=S,cur=document.activeElement;
  document.body.classList.toggle('game',s.active==='game');
  $('#meta').textContent=`${s.version} ${t('by')} @arqzey · daemon ${s.daemon==='1'?t('daemon_run'):t('daemon_stop')}`;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===s.active));

  const ch=chips(s),box=$('#chips');box.innerHTML='';
  if(ch.length)ch.forEach(x=>{const i=document.createElement('i');i.textContent=x;box.append(i)});
  else{const m=document.createElement('span');m.textContent=t('standby');box.append(m)}
  const lv=$('#live');lv.textContent=s.daemon==='1'?t('live_on'):t('live_off');lv.classList.toggle('off',s.daemon!=='1');
  $('#warn').hidden=s.thermal_off!=='1';

  $('#auto').checked=s.auto==='1';$('#dnd').checked=s.dnd==='1';$('#notify').checked=s.notify==='1';
  const hz=[['',t('sysdef')],['60','60 Hz'],['90','90 Hz'],['120','120 Hz'],['144','144 Hz']];
  fillSel($('#rd'),hz,s.refresh_daily);fillSel($('#rg'),hz,s.refresh_game);

  const A=t('gov_auto');
  fillSel($('#cd'),govItems(s.cpu_govs,s.cpu_gov_daily,A),s.cpu_gov_daily);
  fillSel($('#cg'),govItems(s.cpu_govs,s.cpu_gov_game,A),s.cpu_gov_game);
  const hasGpu=!!s.gpu_govs.trim();
  [['gd',s.gpu_gov_daily],['gg',s.gpu_gov_game]].forEach(([id,v])=>{
    const el=$('#'+id);el.disabled=!hasGpu;
    fillSel(el,hasGpu?govItems(s.gpu_govs,v,A):[['',t('gpu_na')]],v);
  });


  fillSel($('#th'),[['running',t('th_run')],['stopped',t('th_stop')]],s.thermal_off==='1'?'stopped':'running');
  fillSel($('#thg'),[['0',t('off')],['45','45 °C'],['48','48 °C'],['50','50 °C'],['55','55 °C']].concat(
    ['0','45','48','50','55'].includes(s.thermal_guard)?[]:[[s.thermal_guard,s.thermal_guard+' °C']]),s.thermal_guard);

  fillSel($('#swp'),numItems([0,10,20,30,40,60,80,100],s.swap_game),s.swap_game);
  fillSel($('#vfs'),numItems([25,50,75,100,150,200],s.vfs_game),s.vfs_game);
  fillSel($('#tcp'),govItems(s.tcp_avail,s.tcp_game,A),s.tcp_game);

  const cells=[[t('k_active'),s.active==='none'?t('none'):t(s.active)],[t('k_gov'),s.governor||'-'],
    [t('k_gpu'),s.gpu_governor||'-'],[t('k_ram'),`${s.ram_free} / ${s.ram_total} MB`],
    [t('k_swap'),s.swappiness||'-'],[t('k_ds'),s.ds_now+'%'],
    [t('k_temp'),s.temp?s.temp+' °C':'-'],[t('k_batt'),s.battery?s.battery+'%':'-']];
  $('#stat').innerHTML=cells.map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('');
}

async function loadGames(){
  const [g,i,r]=await Promise.all([sp('games'),sp('installed'),sp('games','resall')]);
  games=new Set(g.out.split('\n').filter(Boolean));
  gres={};r.out.split('\n').forEach(l=>{const m=l.match(/^(.+)=(\d+)$/);if(m)gres[m[1]]=m[2]});
  installed=i.out.split('\n').filter(Boolean);
  renderList();
}
function renderList(){
  const f=$('#q').value.trim().toLowerCase();
  const all=[...new Set([...games,...installed])].filter(p=>p.toLowerCase().includes(f));
  all.sort((a,b)=>(games.has(b)-games.has(a))||a.localeCompare(b));
  const box=$('#list');box.innerHTML='';
  if(!all.length){const l=document.createElement('label');l.textContent=t('nomatch');box.append(l);return}
  all.forEach(p=>{
    const l=document.createElement('label'),c=document.createElement('input');
    c.type='checkbox';c.checked=games.has(p);
    c.onchange=async()=>{
      const r=await sp('games',c.checked?'add':'remove',p);
      if(r.code!==0){c.checked=!c.checked;toast(r.err||r.out);return}
      c.checked?games.add(p):games.delete(p);if(!c.checked)delete gres[p];toast(t(c.checked?'added':'removed'));renderList();
    };
    const n=document.createElement('span');n.className='pn';n.textContent=p;
    l.append(c,n);
    if(games.has(p)){
      const sel=document.createElement('select');sel.setAttribute('aria-label',t('res'));
      sel.add(new Option(t('res_native'),'100'));
      [90,80,70,60,50,40,30].forEach(v=>sel.add(new Option(v+'%',String(v))));
      sel.value=gres[p]||'100';
      sel.onchange=async()=>{
        const r=await sp('games','res',p,sel.value);
        if(r.code!==0){sel.value=gres[p]||'100';toast(r.err||r.out);return}
        if(sel.value==='100')delete gres[p];else gres[p]=sel.value;toast(t('t_saved'));
      };
      l.append(sel);
    }
    box.append(l);
  });
}

const bindSel=(id,key,slow)=>$('#'+id).onchange=e=>{if(slow)toast(t('working'));act('t_saved','set',key,e.target.value)};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>act('t_'+b.dataset.p,'profile',b.dataset.p));
$('#auto').onchange=e=>act('t_saved','set','AUTO_SWITCH',e.target.checked?1:0);
$('#dnd').onchange=e=>act('t_saved','set','GAME_DND',e.target.checked?1:0);
$('#notify').onchange=e=>act('t_saved','set','NOTIFY',e.target.checked?1:0);
bindSel('rd','REFRESH_DAILY');bindSel('rg','REFRESH_GAME');
bindSel('cd','CPU_GOV_DAILY');bindSel('cg','CPU_GOV_GAME');bindSel('gd','GPU_GOV_DAILY');bindSel('gg','GPU_GOV_GAME');
bindSel('thg','THERMAL_GUARD');bindSel('swp','SWAP_GAME');bindSel('vfs','VFS_GAME');bindSel('tcp','TCP_GAME');
$('#th').onchange=e=>{
  if(e.target.value==='stopped'){
    if(!confirm(t('th_confirm'))){e.target.value='running';return}
    act('t_th_off','thermal','stopped');
  }else act('t_th_on','thermal','running');
};
$('#q').oninput=renderList;
$('#clean').onclick=()=>act(o=>{const m=o.match(/(\d+) MB -> (\d+) MB/);return m?t('t_ram').replace('{a}',m[1]).replace('{b}',m[2]):t('t_saved')},'clean');
$('#trim').onclick=()=>act('t_trim','trimcache');
$('#dex').onclick=()=>act('t_dex','dexopt');
$('#fstrim').onclick=()=>act('t_fstrim','fstrim');
$('#tnotif').onclick=()=>act('t_notif','notify');
$('#restore').onclick=()=>{if(confirm(t('confirm')))act('t_restore','restore')};
$('#logbtn').onclick=async()=>{const r=await sp('log');const p=$('#log');p.dataset.has='1';p.textContent=r.out||t('logempty')};
$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('sp_lang',lang)}catch(x){}applyLang();sp('set','UILANG',lang)};

applyLang();load();loadGames();setInterval(load,10000);
</script>
